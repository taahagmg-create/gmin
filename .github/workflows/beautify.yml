name: Beautify vehicle photos

on:
  workflow_dispatch:
    inputs:
      mode:
        description: What to process
        type: choice
        default: test
        options: [test, backfill, incremental, generate-scenes]
      limit:
        description: "Max vehicles (test mode); 0 = no limit"
        default: "4"
      photos:
        description: Photos per vehicle
        default: "3"
      scene:
        description: "Force one scene (blank = deterministic per vehicle)"
        default: ""
  repository_dispatch:
    types: [new-stock]

concurrency:
  group: beautify
  cancel-in-progress: false

jobs:
  beautify:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install pipeline dependencies
        working-directory: scripts/beautify
        run: npm install --no-audit --no-fund

      - name: Resolve run arguments
        id: args
        run: |
          MODE="${{ github.event.inputs.mode || 'incremental' }}"
          case "$MODE" in
            test)             ARGS="--limit ${{ github.event.inputs.limit || 4 }} --out ./out" ;;
            backfill)         ARGS="--upload" ;;
            incremental)      ARGS="--only-new --upload" ;;
            generate-scenes)  ARGS="" ;;
          esac
          if [ -n "${{ github.event.inputs.scene }}" ] && [ "$MODE" != "generate-scenes" ]; then
            ARGS="$ARGS --scene ${{ github.event.inputs.scene }}"
          fi
          if [ "$MODE" != "generate-scenes" ]; then
            ARGS="$ARGS --photos ${{ github.event.inputs.photos || 3 }}"
          fi
          echo "args=$ARGS" >> "$GITHUB_OUTPUT"
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"

      - name: Run pipeline
        if: steps.args.outputs.mode != 'generate-scenes'
        working-directory: scripts/beautify
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
          BEAUTIFY_LOGO_PATH: ${{ vars.BEAUTIFY_LOGO_PATH }}
          BEAUTIFY_LOGO_BLEND: ${{ vars.BEAUTIFY_LOGO_BLEND }}
        run: >
          node --experimental-strip-types --import ./register.mjs
          run.mjs ${{ steps.args.outputs.args }}

      - name: Generate static scenes
        if: steps.args.outputs.mode == 'generate-scenes'
        working-directory: scripts/beautify
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
        run: >
          node --experimental-strip-types --import ./register.mjs
          generate-scenes.mjs --force

      - name: Upload test batch for review
        if: steps.args.outputs.mode == 'test'
        uses: actions/upload-artifact@v4
        with:
          name: beautify-test-batch
          path: scripts/beautify/out/
          retention-days: 14

      - name: Commit scenes
        if: steps.args.outputs.mode == 'generate-scenes'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add scripts/beautify/scenes/
          git commit -m "chore: add static background scenes [skip ci]"
          git push

      - name: Commit manifest
        if: steps.args.outputs.mode == 'backfill' || steps.args.outputs.mode == 'incremental'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- src/data/beautify-manifest.json; then
            echo "manifest unchanged"
          else
            git add src/data/beautify-manifest.json
            git commit -m "chore: update beautified photo manifest [skip ci]"
            git push
          fi
